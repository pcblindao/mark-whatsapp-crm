[supervisord]
nodaemon=true
logfile=/data/supervisor.log
pidfile=/data/supervisor.pid
[program:bridge]
command=/usr/local/bin/whatsapp-bridge
directory=/data
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/data/bridge.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/data/bridge-error.log
stderr_logfile_maxbytes=10MB
[program:painel]
command=python /data/WhatsApp-Assistente/painel/server.py
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/data/painel.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/data/painel-error.log
stderr_logfile_maxbytes=10MB
