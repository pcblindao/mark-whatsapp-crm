</style></head><body><div class="shell"><aside><div><h1>Mark<br>WhatsApp CRM</h1><small>Seu relacionamento, organizado.</small></div><nav id="nav"></nav><div><a href="/">← Voltar ao WhatsApp</a><select id="crm-theme" class="theme-picker" aria-label="Tema"><option value="auto">Tema automático</option><option value="claro">Tema claro</option><option value="escuro">Tema escuro</option></select></div></aside><main><header><div><h2 id="page-title"></h2><p id="subtitle"></p></div><div class="actions" id="actions"></div></header><div id="notice" role="status"></div><div class="filters" id="filters"></div><div id="content"></div><footer>Criado por Marcos Roberto · Mark WhatsApp CRM</footer></main></div><dialog id="modal"><header><h2 id="modal-title"></h2><button class="btn" id="close" aria-label="Fechar">✕</button></header><div id="modal-body"></div></dialog><div class="print" id="print"></div><input hidden type="file" id="import-file" accept=".csv,text/csv"><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages={configuracoes:['Configurações','Colunas, campos e preferências do seu CRM.'],dashboard:['Visão geral','Seus próximos passos e resultados.'],oportunidades:['Funil de vendas','Acompanhe cada negociação até o fechamento.'],clientes:['Clientes','Contatos, empresas e histórico em um só lugar.'],propostas:['Propostas','Monte propostas, acompanhe o retorno e imprima em PDF.'],tarefas:['Tarefas','Organize retornos, compromissos e prazos.'],atividades:['Atividades','Registre ligações, reuniões e anotações.'],produtos:['Produtos e serviços','Seu catálogo para montar propostas.'],equipe:['Responsáveis','Cadastre as pessoas que acompanham clientes e vendas.'],relatorios:['Relatórios','Visão dos valores registrados no CRM.'],historico:['Histórico','Alterações e movimentações dos registros.']};
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((v||0)/100),date=v=>v?new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR'):'—',today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let data={},page=location.hash.slice(1)||'dashboard',query='',owner='',status='',archived=false,editing=null,contacts=[],toastTimer;
if(!pages[page])page='dashboard';
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4000);}
async function api(body,path='/api/crm'){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Painel':'1'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.erro||'Não foi possível concluir');return d;}
async function refresh(){data=await api();render();}
const active=t=>(data[t]||[]).filter(x=>!x.arquivado),client=id=>(data.clientes||[]).find(c=>c.id===id),clientName=id=>client(id)?.nome||'Sem cliente';
const label=t=>pages[t]?.[0]||t;
function rows(t){return (data[t]||[]).filter(x=>(archived?!!x.arquivado:!x.arquivado)&&(!owner||x.responsavel===owner)&&(!status||(t==='tarefas'?(status==='Vencidas'?!x.concluida&&x.prazo&&x.prazo<today():status==='Concluídas'?!!x.concluida:!x.concluida):(x.etapa||x.status)===status))&&(!query||(Object.values(x).filter(v=>typeof v==='string').join(' ')+' '+clientName(x.cliente_id)).toLocaleLowerCase().includes(query.toLocaleLowerCase())));}
const btn=(text,action,id='',type='')=>`<button type="button" class="btn small ${type}" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
const wa=c=>c?.jid?btn('Conversa','conversation',c.id)+`<a class="btn small" href="/?crm_chat=${encodeURIComponent(c.jid)}">WhatsApp ↗</a>`:'';
function metrics(){const ops=active('oportunidades'),open=ops.filter(o=>stageType(o.etapa)==='aberta'),won=ops.filter(o=>stageType(o.etapa)==='ganho'),lost=ops.filter(o=>stageType(o.etapa)==='perdido'),due=active('tarefas').filter(t=>!t.concluida&&t.prazo&&t.prazo<=today());return {ops,open,won,lost,due};}
function render(){const [title,sub]=pages[page];$('#page-title').textContent=title;$('#subtitle').textContent=sub;$('#nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${k===page?'active':''}" data-page="${k}">${v[0]}</button>`).join('');const isEntity=!!data[page]&&page!=='historico';$('#actions').innerHTML=btn('Atualizar','refresh')+(isEntity?btn('Exportar CSV','export')+btn('+ Novo','new','','primary'):'')+(page==='clientes'?btn('Do WhatsApp','contacts')+btn('Importar CSV','import'):'');
$('#filters').innerHTML=isEntity?`<input type="search" id="search" placeholder="Pesquisar ${title.toLowerCase()}" value="${esc(query)}" aria-label="Pesquisar"><select id="owner" aria-label="Responsável"><option value="">Todos os responsáveis</option>${[...new Set([...(data[page]||[]).map(x=>x.responsavel),...active('equipe').map(x=>x.nome)])].filter(Boolean).map(x=>`<option ${owner===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${['oportunidades','tarefas','propostas'].includes(page)?`<select id="status" aria-label="Situação"><option value="">Todas as situações</option>${(page==='oportunidades'?data.etapas:page==='tarefas'?['Pendentes','Vencidas','Concluídas']:['Rascunho','Enviada','Aceita','Recusada']).map(x=>`<option ${status===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}<label class="check"><input type="checkbox" id="archived" ${archived?'checked':''}>Arquivados</label>`:'';
if($('#search')){$('#search').oninput=e=>{query=e.target.value;renderContent();};$('#owner').onchange=e=>{owner=e.target.value;renderContent();};$('#archived').onchange=e=>{archived=e.target.checked;renderContent();};if($('#status'))$('#status').onchange=e=>{status=e.target.value;renderContent();};}renderContent();}
function renderContent(){if(page==='configuracoes'){renderSettings();return;}let html='';const m=metrics();
if(['dashboard','relatorios'].includes(page)){const sum=a=>a.reduce((n,o)=>n+o.valor_centavos,0),rate=m.won.length+m.lost.length?Math.round(100*m.won.length/(m.won.length+m.lost.length)):0;html=`<div class="metrics">${[['Em negociação',money(sum(m.open))],['Vendas ganhas',money(sum(m.won))],['Conversão de encerradas',rate+'%'],['Tarefas até hoje',m.due.length]].map(([a,b])=>`<div class="metric"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div><div class="grid"><section class="panel"><h3>Distribuição do funil</h3>${data.etapas.map(e=>{const a=m.ops.filter(o=>o.etapa===e);return `<div>${esc(e)} · ${a.length} · ${money(sum(a))}<div class="bar"><i style="width:${m.ops.length?a.length/m.ops.length*100:0}%"></i></div></div>`;}).join('')}</section><section class="panel"><h3>Próximos retornos</h3>${m.due.length?m.due.slice(0,10).sort((a,b)=>a.prazo.localeCompare(b.prazo)).map(t=>`<p><b>${esc(t.titulo)}</b><br><small>${esc(clientName(t.cliente_id))} · ${date(t.prazo)}</small> ${btn('Concluir','complete',t.id)}</p>`).join(''):'<p class="note">Nenhuma tarefa pendente até hoje.</p>'}</section></div>`;
if(page==='relatorios'){const names=[...new Set(m.ops.map(o=>o.responsavel||'Sem responsável'))];html+=`<h3>Resultados por responsável</h3><div class="table-wrap"><table><tr><th>Responsável</th><th>Oportunidades</th><th>Ganhas</th><th>Valor ganho</th></tr>${names.map(n=>{const a=m.ops.filter(o=>(o.responsavel||'Sem responsável')===n),w=a.filter(o=>stageType(o.etapa)==='ganho');return `<tr><td>${esc(n)}</td><td>${a.length}</td><td>${w.length}</td><td>${money(sum(w))}</td></tr>`;}).join('')}</table></div><p class="note">Totais dos registros ativos, de todo o período. Vendas ganhas não representam confirmação de recebimento financeiro.</p>`;}}
else if(page==='oportunidades'&&!archived){const list=rows(page);html=`<div class="board">${data.etapas.map(e=>{const a=list.filter(o=>o.etapa===e);return `<section class="column" data-stage="${esc(e)}" style="border-top:3px solid ${data.config.etapas.find(x=>x.nome===e)?.cor||'#008069'}"><h3>${esc(e)} <span class="tag">${a.length}</span></h3><small>${money(a.reduce((n,o)=>n+o.valor_centavos,0))}</small>${a.map(o=>`<article class="card" draggable="true" data-drag="${esc(o.id)}"><b>${esc(o.titulo)}</b><p>${esc(clientName(o.cliente_id))}</p><p class="money">${money(o.valor_centavos)}</p><p>${esc(o.responsavel||'Sem responsável')} · ${date(o.previsao)}</p>${btn('Editar / mover','edit',o.id)}${wa(client(o.cliente_id))}</article>`).join('')}</section>`;}).join('')}</div><p class="note">Arraste os cartões entre as etapas ou use Editar / mover.</p>`;}
else if(page==='historico'){html=table(['Data','Registro','Evento'],data.historico.map(x=>[date(x.em),esc(label(x.entidade)),esc(x.evento)]));}
else{const list=rows(page);html=list.length?table([page==='clientes'?'Cliente':'Registro','Informações','Ações'],list.map(o=>{let info='';if(page==='clientes')info=`${esc(o.empresa)}<small>${esc(o.telefone)} · ${esc(o.email)}</small><small>${esc(o.origem)} · ${esc(o.responsavel)}</small>`;else if(page==='propostas')info=`${esc(clientName(o.cliente_id))}<small>${money(o.total_centavos)} · ${esc(o.status)} · Validade ${date(o.validade)}</small>`;else if(page==='tarefas')info=`${esc(clientName(o.cliente_id))}<small>${date(o.prazo)} · ${esc(o.responsavel)}</small><span class="tag ${!o.concluida&&o.prazo&&o.prazo<today()?'red':''}">${o.concluida?'Concluída':o.prazo&&o.prazo<today()?'Vencida':'Pendente'} · ${esc(o.prioridade)}</span>`;else if(page==='produtos')info=money(o.valor_centavos)+`<small>${esc(o.descricao)}</small>`;else if(page==='atividades')info=esc(clientName(o.cliente_id))+`<small>${esc(o.tipo)} · ${esc(o.notas)}</small>`;else if(page==='equipe')info=esc(o.email)+`<small>${esc(o.funcao)}</small>`;else info=esc(o.etapa)+' · '+money(o.valor_centavos);info+=customSummary(page,o);let actions=o.arquivado?btn('Restaurar','restore',o.id):btn('Editar','edit',o.id)+btn('Arquivar','archive',o.id);if(!o.arquivado&&page==='clientes')actions=btn('Ficha','profile',o.id)+wa(o)+actions;if(!o.arquivado&&page==='tarefas')actions=btn(o.concluida?'Reabrir':'Concluir','complete',o.id)+actions;if(!o.arquivado&&page==='propostas')actions=btn('Ver / PDF','proposal',o.id)+btn('Criar oportunidade','convert',o.id)+actions;return [esc(o.nome||o.titulo),info,actions];})):empty();if(page==='equipe')html+='<p class="note">Responsáveis organizam a atribuição do trabalho. O acesso desta instalação continua compartilhado; este cadastro não cria logins nem permissões individuais.</p>';}
$('#content').innerHTML=html;document.querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));document.querySelectorAll('[data-stage]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('over');};el.ondragleave=()=>el.classList.remove('over');el.ondrop=async e=>{e.preventDefault();el.classList.remove('over');const o=data.oportunidades.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(o)await saveAction({entidade:'oportunidades',id:o.id,versao:o.atualizado,etapa:el.dataset.stage});};});}
function empty(){return '<div class="empty"><h3>Nenhum registro por aqui</h3><p>Crie um registro ou ajuste os filtros para começar.</p></div>';}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}

function openEditor(t,o={}){if(t==='propostas'&&!o.id){const dt=new Date();dt.setDate(dt.getDate()+data.config.propostas.validade_dias);o={validade:[dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),String(dt.getDate()).padStart(2,'0')].join('-'),notas:data.config.propostas.condicoes,...o};}editing={t,o};$('#modal-title').textContent=(o.id?'Editar · ':'Novo · ')+label(t);$('#modal-body').innerHTML=`<form id="edit-form"><div class="fields">${fields[t].map(k=>{const opts=options(k),v=o[k]??(k==='prioridade'?'Normal':'');let input=opts?`<select name="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:['notas','descricao'].includes(k)?`<textarea name="${k}" maxlength="10000">${esc(v)}</textarea>`:`<input name="${k}" ${['titulo','nome'].includes(k)?'required maxlength="200"':''} ${k==='responsavel'?'list="owners"':''} type="${['prazo','previsao','validade'].includes(k)?'date':k.endsWith('_centavos')?'number':k==='email'?'email':'text'}" ${k.endsWith('_centavos')?'min="0" step="0.01"':''} value="${esc(k.endsWith('_centavos')?(Number(v)||0)/100:v)}">`;return `<label class="${['notas','descricao','jid'].includes(k)?'wide':''}">${names[k]}${input}</label>`;}).join('')}${customFields(t,o)}</div><datalist id="owners">${active('equipe').map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist>${t==='propostas'?`<h3>Itens da proposta</h3><p class="note">Descrição · Quantidade · Valor unitário</p><div id="items"></div><div class="actions">${btn('+ Item','add-item')}<select id="catalog"><option value="">Adicionar do catálogo…</option>${active('produtos').map(x=>`<option value="${esc(x.id)}">${esc(x.nome)} · ${money(x.valor_centavos)}</option>`).join('')}</select></div><p id="proposal-total"></p>`:''}<p class="error" id="form-error" role="alert"></p><div class="footer"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Salvar</button></div></form>`;
if(t==='propostas'){(o.itens?.length?o.itens:[{nome:'',quantidade:1,valor_centavos:0}]).forEach(addItem);$('#catalog').onchange=e=>{const p=active('produtos').find(x=>x.id===e.target.value);if(p)addItem({nome:p.nome,quantidade:1,valor_centavos:p.valor_centavos});e.target.value='';};$('#edit-form').oninput=proposalTotal;proposalTotal();}
$('#cancel').onclick=()=>$('#modal').close();$('#edit-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.entidade=t;d.extras=readCustom(t,e.target);if(o.id){d.id=o.id;d.versao=o.atualizado;}for(const k of ['valor_centavos','desconto_centavos'])if(k in d)d[k]=Math.round(Number(d[k])*100);if('concluida'in d)d.concluida=Number(d.concluida);if(t==='propostas')d.itens=readItems();$('#save').disabled=true;try{await api(d);$('#modal').close();await refresh();toast('Registro salvo');}catch(e){$('#form-error').textContent=e.message;}finally{if($('#save'))$('#save').disabled=false;}};if(!$('#modal').open)$('#modal').showModal();}
function addItem(i={nome:'',quantidade:1,valor_centavos:0}){$('#items').insertAdjacentHTML('beforeend',`<div class="item"><input data-item="nome" placeholder="Descrição" required maxlength="200" aria-label="Descrição do item" value="${esc(i.nome)}"><input data-item="quantidade" type="number" min="1" max="10000" required aria-label="Quantidade" value="${i.quantidade}"><input data-item="valor" type="number" min="0" step="0.01" required aria-label="Valor unitário" value="${i.valor_centavos/100}"><button type="button" class="btn small danger" data-action="remove-item" aria-label="Remover item">×</button></div>`);proposalTotal();}
function readItems(){return [...document.querySelectorAll('#items .item')].map(el=>({nome:el.querySelector('[data-item=nome]').value,quantidade:Number(el.querySelector('[data-item=quantidade]').value),valor_centavos:Math.round(Number(el.querySelector('[data-item=valor]').value)*100)}));}
function proposalTotal(){if(!$('#proposal-total'))return;const discount=Number($('#edit-form [name=desconto_centavos]').value||0)*100;$('#proposal-total').textContent='Total: '+money(readItems().reduce((s,i)=>s+i.quantidade*i.valor_centavos,0)-discount);}
async function saveAction(d){try{await api(d);await refresh();toast('Alteração salva');}catch(e){$('#notice').className='error';$('#notice').textContent=e.message;}}
function profile(id){const c=client(id);$('#modal-title').textContent=c.nome;$('#modal-body').innerHTML=`<div class="dialog-body"><p>${esc(c.empresa)}<br>${esc(c.telefone)} · ${esc(c.email)}</p><div class="actions">${wa(c)}${btn('+ Oportunidade','client-op',id)}${btn('+ Tarefa','client-task',id)}${btn('+ Atividade','client-activity',id)}${btn('+ Proposta','client-proposal',id)}</div><p style="white-space:pre-wrap">${esc(c.notas)}</p>${customSummary('clientes',c)}<h3>Negociações</h3>${active('oportunidades').filter(o=>o.cliente_id===id).map(o=>`<p>${esc(o.titulo)} · ${esc(o.etapa)} · ${money(o.valor_centavos)}</p>`).join('')||'<p class="note">Sem oportunidades.</p>'}<h3>Acompanhamento</h3><div class="timeline">${[...active('atividades').filter(o=>o.cliente_id===id).map(o=>({titulo:o.titulo,notas:o.notas,em:o.atualizado,tipo:o.tipo})),...active('tarefas').filter(o=>o.cliente_id===id).map(o=>({titulo:o.titulo,notas:o.notas,em:o.atualizado,tipo:(o.concluida?'Concluída':'Pendente')+' · '+date(o.prazo)}))].sort((a,b)=>b.em.localeCompare(a.em)).map(o=>`<article><b>${esc(o.titulo)}</b><small> · ${esc(o.tipo)} · ${date(o.em)}</small><p>${esc(o.notas)}</p></article>`).join('')||'<p class="note">Registre seu primeiro contato ou próximo retorno.</p>'}</div></div>`;$('#modal').showModal();}
function proposal(id){const p=data.propostas.find(x=>x.id===id),c=client(p.cliente_id);const company=data.config.empresa;const html=`<div><b>${esc(company.nome)}</b><p>${esc(company.documento)} · ${esc(company.email)} · ${esc(company.telefone)}<br>${esc(company.endereco)}</p></div><h1>${esc(p.titulo)}</h1><p>Proposta ${esc(p.id.slice(0,8).toUpperCase())} · ${date(p.criado||p.atualizado)}</p><p><b>${esc(c?.nome||'Cliente não informado')}</b><br>${esc(c?.empresa||'')}<br>${esc(c?.email||'')}</p><p>Validade: ${date(p.validade)} · Situação: ${esc(p.status)}</p>${table(['Item','Quantidade','Unitário','Subtotal'],p.itens.map(i=>[esc(i.nome),i.quantidade,money(i.valor_centavos),money(i.quantidade*i.valor_centavos)]))}<p>Desconto: ${money(p.desconto_centavos)}</p><h2>Total: ${money(p.total_centavos)}</h2><p style="white-space:pre-wrap">${esc(p.notas)}</p>`;$('#modal-title').textContent='Proposta comercial';$('#modal-body').innerHTML=`<div class="dialog-body">${html}<div class="footer">${btn('Imprimir / salvar PDF','print')}${wa(c)}</div></div>`;$('#print').innerHTML=html;$('#modal').showModal();}
async function showContacts(){const r=await api(null,'/api/crm/contatos');contacts=r.contatos;$('#modal-title').textContent='Adicionar cliente do WhatsApp';$('#modal-body').innerHTML='<div class="dialog-body"><input id="contact-search" type="search" placeholder="Pesquisar nome ou telefone" style="width:100%"><p class="note">Selecione um contato para revisar e salvar a ficha.</p><div id="contact-list"></div></div>';const draw=()=>{const q=$('#contact-search').value.toLowerCase();$('#contact-list').innerHTML=contacts.filter(c=>(c.nome+' '+c.telefone).toLowerCase().includes(q)).slice(0,50).map(c=>`<p>${esc(c.nome)} · ${esc(c.telefone)} ${btn('Selecionar','contact',c.jid)}</p>`).join('')||'<p>Nenhum contato encontrado.</p>';};$('#contact-search').oninput=draw;draw();$('#modal').showModal();}
function exportCSV(){const list=rows(page).map(x=>({...x}));if(!list.length)return toast('Nenhum registro para exportar');const keys=Object.keys(list[0]).filter(k=>!['itens','extras'].includes(k));for(const f of data.config.campos.filter(f=>f.entidade===page&&f.ativo)){const col='Campo: '+f.nome+' ('+f.id+')';keys.push(col);for(const x of list)x[col]=x.extras?.[f.id]??'';}const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const text=[keys,...list.map(x=>keys.map(k=>x[k]))].map(r=>r.map(cell).join(';')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='mark-crm-'+page+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function parseCSV(s){s=s.replace(/^\ufeff/,'');const sep=s.split(/\r?\n/)[0].includes(';')?';':',';let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++;}else quoted=!quoted;}else if(c===sep&&!quoted){row.push(v);v='';}else if(c==='\n'&&!quoted){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v='';}else v+=c;}if(quoted)throw Error('CSV com aspas incompletas');if(v||row.length){row.push(v.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(Boolean));}
$('#import-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('Limite de importação: 1 MB');const all=parseCSV(await file.text()),head=all.shift()?.map(x=>x.trim().toLowerCase());if(!head?.includes('nome'))throw Error('O CSV precisa da coluna nome. Opcionais: telefone, email, empresa, origem, responsavel, notas.');if(all.length>200)throw Error('Importe até 200 clientes por vez');const records=all.map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]||'']))).filter(r=>r.nome);if(!confirm(`Importar ${records.length} clientes? Números e e-mails já cadastrados serão ignorados.`))return;let saved=0,skipped=0;const known=[...active('clientes')];for(const r of records){if(known.some(c=>(r.telefone&&c.telefone.replace(/\D/g,'')===r.telefone.replace(/\D/g,''))||(r.email&&c.email.toLowerCase()===r.email.toLowerCase()))){skipped++;continue;}const d={entidade:'clientes'};for(const k of ['nome','telefone','email','empresa','origem','responsavel','notas'])d[k]=r[k]||'';try{await api(d);known.push(d);saved++;}catch(err){await refresh();throw Error(`Importação parcial: ${saved} salvos, ${skipped} ignorados. Falha em ${r.nome}: ${err.message}`);}}await refresh();toast(`${saved} clientes importados; ${skipped} ignorados.`);}catch(err){$('#notice').className='error';$('#notice').textContent=err.message;}finally{e.target.value='';}};
document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;location.hash=page;query=owner=status='';archived=false;render();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,o=(data[page]||[]).find(x=>x.id===id);try{if(a==='new')openEditor(page);else if(a==='edit')openEditor(page,o);else if(a==='refresh')await refresh();else if(a==='export')exportCSV();else if(a==='import')$('#import-file').click();else if(a==='contacts')await showContacts();else if(a==='contact'){const c=contacts.find(x=>x.jid===id),existing=active('clientes').find(x=>x.jid===id);openEditor('clientes',existing||{nome:c.nome,telefone:c.telefone,jid:c.jid});}else if(a==='archive'&&confirm('Arquivar este registro? Você poderá restaurá-lo usando o filtro Arquivados.'))await saveAction({entidade:page,id,acao:'arquivar',versao:o.atualizado});else if(a==='restore')await saveAction({entidade:page,id,acao:'restaurar',versao:o.atualizado});else if(a==='complete'){const t=data.tarefas.find(x=>x.id===id);await saveAction({entidade:'tarefas',id,versao:t.atualizado,concluida:t.concluida?0:1});}else if(a==='conversation')await openConversation(id);else if(a==='profile')profile(id);else if(a.startsWith('client-')){const t={'client-op':'oportunidades','client-task':'tarefas','client-activity':'atividades','client-proposal':'propostas'}[a];openEditor(t,{cliente_id:id});}else if(a==='proposal')proposal(id);else if(a==='print')window.print();else if(a==='convert'){const p=data.propostas.find(x=>x.id===id);openEditor('oportunidades',{titulo:p.titulo,cliente_id:p.cliente_id,valor_centavos:p.total_centavos,etapa:p.status==='Aceita'?data.config.etapas.find(e=>e.tipo==='ganho').nome:data.config.etapas.find(e=>e.tipo==='aberta').nome,notas:'Proposta: '+p.id});}else if(a==='add-item')addItem();else if(a==='remove-item'){b.closest('.item').remove();proposalTotal();}}catch(err){$('#notice').className='error';$('#notice').textContent=err.message;}});
function stageType(name){return data.config.etapas.find(e=>e.nome===name)?.tipo||'aberta';}
function customFields(t,o){return data.config.campos.filter(f=>f.entidade===t&&f.ativo).map(f=>{const v=o.extras?.[f.id]??'',req=f.obrigatorio?'required':'',attrs=`data-custom="${esc(f.id)}" ${req}`;let input;if(f.tipo==='selecao'||f.tipo==='booleano'){const opts=f.tipo==='booleano'?[['true','Sim'],['false','Não']]:f.opcoes.map(x=>[x,x]);input=`<select ${attrs}><option value="">Selecione…</option>${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===a?'selected':''}>${esc(b)}</option>`).join('')}</select>`;}else input=`<input ${attrs} type="${f.tipo==='numero'?'number':f.tipo==='data'?'date':'text'}" ${f.tipo==='numero'?'step="any"':''} maxlength="5000" value="${esc(v)}">`;return `<label>${esc(f.nome)}${f.obrigatorio?' *':''}${input}</label>`;}).join('');}

function renderSettings(){const c=data.config;settingsVersion=c.versao;$('#content').innerHTML=`<form id="settings-form"><section class="panel settings-section"><h3>Empresa</h3><div class="fields">${Object.entries({nome:'Nome da empresa',documento:'CPF / CNPJ',email:'E-mail comercial',telefone:'Telefone',endereco:'Endereço'}).map(([k,l])=>`<label>${l}<input data-company="${k}" maxlength="500" value="${esc(c.empresa[k])}"></label>`).join('')}</div><p class="note">Esses dados aparecem no cabeçalho das propostas.</p></section><section class="panel settings-section"><h3>Colunas do funil</h3><p class="note">Renomeie, ordene e escolha a cor. Marque a coluna que representa vendas ganhas e perdidas. Para excluir uma coluna, mova primeiro suas oportunidades, inclusive arquivadas.</p><div class="settings-scroll"><div id="stage-rows">${c.etapas.map(stageRow).join('')}</div></div>${btn('+ Coluna','stage-add')}</section><section class="panel settings-section"><h3>Campos personalizados</h3><p class="note">Crie campos para clientes, oportunidades, propostas e demais módulos. Campos ativos aparecem nos formulários e nas fichas.</p><div id="field-rows">${c.campos.map(f=>fieldRow({...f,saved:true})).join('')}</div>${btn('+ Campo','field-add')}</section><section class="panel settings-section"><h3>Padrões das propostas</h3><div class="fields"><label>Validade em dias<input id="setting-days" type="number" min="1" max="365" required value="${c.propostas.validade_dias}"></label><label class="wide">Condições comerciais padrão<textarea id="setting-terms" maxlength="10000">${esc(c.propostas.condicoes)}</textarea></label></div><p class="note">Aplicados às novas propostas; propostas existentes mantêm seus textos e datas.</p></section><div class="settings-footer"><button class="btn primary" id="settings-save">Salvar configurações</button><span id="settings-error" class="error" role="alert"></span></div></form>`;
$('#settings-form').onsubmit=async e=>{e.preventDefault();const cfg={empresa:{},propostas:{validade_dias:Number($('#setting-days').value),condicoes:$('#setting-terms').value},etapas:[...document.querySelectorAll('[data-stage-id]')].map(el=>({id:el.dataset.stageId,...Object.fromEntries([...el.querySelectorAll('[data-setting]')].map(x=>[x.dataset.setting,x.value]))})),campos:[...document.querySelectorAll('[data-field-id]')].map(el=>({id:el.dataset.fieldId,...Object.fromEntries([...el.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.type==='checkbox'?x.checked:x.dataset.field==='opcoes'?x.value.split('\n').map(s=>s.trim()).filter(Boolean):x.value]))}))};for(const el of document.querySelectorAll('[data-company]'))cfg.empresa[el.dataset.company]=el.value;$('#settings-save').disabled=true;try{await api({acao:'configurar',config:cfg,versao:settingsVersion});await refresh();toast('Configurações salvas');}catch(err){$('#settings-error').textContent=err.message;}finally{if($('#settings-save'))$('#settings-save').disabled=false;}};

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,row=b.closest('[data-stage-id]');if(a==='stage-add')$('#stage-rows').insertAdjacentHTML('beforeend',stageRow({id:'col_'+crypto.randomUUID(),nome:'Nova coluna',tipo:'aberta',cor:'#008069'}));if(a==='stage-up'&&row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);if(a==='stage-down'&&row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);if(a==='stage-remove'&&confirm('Remover esta coluna ao salvar? Colunas com oportunidades não podem ser removidas.'))row.remove();if(a==='field-add')$('#field-rows').insertAdjacentHTML('beforeend',fieldRow({id:'campo_'+crypto.randomUUID(),nome:'Novo campo',entidade:'clientes',tipo:'texto',ativo:true,obrigatorio:false,opcoes:[]}));});
function setTheme(v,save=false){if(!['auto','claro','escuro'].includes(v))v='auto';if(v==='auto')delete document.documentElement.dataset.tema;else document.documentElement.dataset.tema=v;$('#crm-theme').value=v;if(save)try{localStorage.setItem('painel.tema',v);}catch{} }
try{setTheme(localStorage.getItem('painel.tema')||'auto');}catch{setTheme('auto');}$('#crm-theme').onchange=e=>setTheme(e.target.value,true);window.addEventListener('storage',e=>{if(e.key==='painel.tema')setTheme(e.newValue);});
let conversationTimer=null,conversationGeneration=0;
async function openConversation(id){const c=client(id);if(!c?.jid)return;clearInterval(conversationTimer);const gen=++conversationGeneration;$('#modal-title').textContent='Conversa · '+c.nome;$('#modal-body').innerHTML=`<div class="dialog-body"><div class="actions">${btn('Ficha do cliente','chat-profile',id)}${btn('+ Oportunidade','client-op',id)}${btn('+ Tarefa','client-task',id)}${btn('+ Atividade','client-activity',id)}<a class="btn small" href="/?crm_chat=${encodeURIComponent(c.jid)}">WhatsApp completo ↗</a></div><p class="note">Últimas 60 mensagens. Atualização a cada 5 segundos. Mídias completas ficam disponíveis no WhatsApp.</p><div id="conversation-messages" class="conversation-messages" aria-live="polite"></div><form id="conversation-form"><div class="conversation-compose"><textarea id="conversation-text" required maxlength="4000" placeholder="Escreva uma mensagem" aria-label="Mensagem para o cliente"></textarea><button class="btn primary" id="conversation-send">Enviar</button></div></form><p id="conversation-status" role="status"></p></div>`;if(!$('#modal').open)$('#modal').showModal();
const load=async()=>{try{const r=await api(null,'/api/mensagens?jid='+encodeURIComponent(c.jid)+'&limite=60');if(gen!==conversationGeneration||!$('#conversation-messages'))return;const box=$('#conversation-messages'),bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-60;box.innerHTML=(r.mensagens||[]).map(m=>`<div class="bubble ${m.eu?'mine':''}">${esc(m.apagada?'Mensagem apagada':m.texto||m.transcricao||(m.midia?'['+m.midia+']':''))}<small>${esc(m.hora||'')}</small></div>`).join('')||'<p>Nenhuma mensagem disponível.</p>';if(bottom)box.scrollTop=box.scrollHeight;}catch(e){if($('#conversation-status'))$('#conversation-status').textContent=e.message;}};
$('#conversation-form').onsubmit=async e=>{e.preventDefault();const text=$('#conversation-text').value.trim();if(!text)return;const button=$('#conversation-send');button.disabled=true;$('#conversation-status').textContent='Enviando…';try{await api({jid:c.jid,texto:text},'/api/enviar');if(gen!==conversationGeneration||!$('#conversation-text'))return;$('#conversation-text').value='';$('#conversation-status').textContent='Mensagem enviada';button.disabled=false;await load();}catch(err){if($('#conversation-status'))$('#conversation-status').textContent='Envio não confirmado. Confira a conversa antes de tentar novamente. '+err.message;}};
await load();conversationTimer=setInterval(()=>{if(!$('#modal').open||!$('#conversation-messages')){clearInterval(conversationTimer);return;}if(!document.hidden)load();},5000);
}
$('#modal').addEventListener('close',()=>{clearInterval(conversationTimer);conversationGeneration++;});document.addEventListener('click',e=>{const b=e.target.closest('[data-action="chat-profile"]');if(b){clearInterval(conversationTimer);conversationGeneration++;profile(b.dataset.id);}});

$('#close').onclick=()=>$('#modal').close();refresh().then(()=>{const params=new URLSearchParams(location.search),jid=params.get('jid');if(jid){const c=active('clientes').find(x=>x.jid===jid);if(c){const action=params.get('acao');if(['oportunidades','tarefas','atividades'].includes(action))openEditor(action,{cliente_id:c.id});else profile(c.id);}else openEditor('clientes',{nome:params.get('nome')||'',jid,telefone:jid.endsWith('@s.whatsapp.net')?jid.split('@')[0]:''});}}).catch(e=>{$('#notice').className='error';$('#notice').textContent=e.message;});
</script></body></html>
