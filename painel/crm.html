<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark WhatsApp CRM</title>
<style>
:root{--bg:#f3f6f9;--ink:#172c38;--muted:#667886;--line:#dce4ea;--brand:#007e70;--soft:#e8f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--brand)}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{min-width:0;background:#102f38;color:#dcebea;padding:26px 16px;display:flex;flex-direction:column;gap:24px}aside h1{font-size:20px;line-height:1.3;margin:0}aside small{color:#9bb9bf}nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#c3d8dc;padding:12px;text-align:left;border-radius:8px}nav button.active{color:white;background:#23606a}aside a{color:#c9f3e6;margin-top:auto}main{padding:30px;min-width:0}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h2{font-size:28px;margin:0 0 8px}p{line-height:1.6}header p{margin:0;color:var(--muted)}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters{margin:24px 0}.filters input{flex:1;min-width:190px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px 13px;text-decoration:none;display:inline-flex;align-items:center;gap:5px}.primary{background:var(--brand);color:white;border-color:var(--brand)}.danger{color:#ac2434}.small{font-size:12px;padding:6px 9px}input,select,textarea{border:1px solid #cbd6dd;border-radius:7px;padding:10px;background:white;color:var(--ink);max-width:100%}input:focus,select:focus,textarea:focus{outline:2px solid #8fd8c6;outline-offset:1px}label{display:grid;gap:6px;color:#48616f}label.check{display:flex;align-items:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.metric,.panel{padding:20px;background:white;border:1px solid var(--line);border-radius:12px}.metric small{display:block;color:var(--muted);margin-bottom:12px}.metric strong{font-s 009782}.timeline{border-left:2px solid #dce7e9;padding:0 0 0 18px;margin-top:20px}.timeline article{margin:0 0 20px}.timeline p{white-space:pre-wrap;margin:6px 0}.toast{position:fixed;bottom:20px;right:20px;background:#163b43;color:white;padding:14px 22px;border-radius:10px;z-index:10}.print{display:none}footer{margin-top:28px;color:var(--muted);font-size:12px}@media(max-width:950px){.shell{grid-template-columns:minmax(0,1fr)}aside{padding:16px;gap:14px}aside h1{font-size:18px}aside small{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside a{margin:0}main{padding:18px}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.fields{grid-template-columns:1fr}.item{grid-template-columns:1fr 65px 85px 30px;gap:4px}.metric strong{font-size:21px}.actions .btn{font-size:12px}}@media print{body>*{display:none!important}body>.print{display:block!important;color:#111;background:white;padding:25px}table{font-size:12px}.print h1{font-size:25px}}
</style></head><body><div class="shell"><aside><div><h1>Mark<br>WhatsApp CRM</h1><small>Seu relacionamento, organizado.</small></div><nav id="nav"></nav><a href="/">← Voltar ao WhatsApp</a></aside><main><header><div><h2 id="page-title"></h2><p id="subtitle"></p></div><div class="actions" id="actions"></div></header><div id="notice" role="status"></div><div class="filters" id="filters"></div><div id="content"></div><footer>Criado por Marcos Roberto · Mark WhatsApp CRM</footer></main></div><dialog id="modal"><header><h2 id="modal-title"></h2><button class="btn" id="close" aria-label="Fechar">✕</button></header><div id="modal-body"></div></dialog><div class="print" id="print"></div><input hidden type="file" id="import-file" accept=".csv,text/csv"><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages={dashboard:['Visão geral','Seus próximos passos e resultados.'],oportunidades:['Funil de vendas','Acompanhe cada negociação até o fechamento.'],clientes:['Clientes','Contatos, empresas e histórico em um só lugar.'],propostas:['Propostas','Monte propostas, acompanhe o retorno e imprima em PDF.'],tarefas:['Tarefas','Organize retornos, compromissos e prazos.'],atividades:['Atividades','Registre ligações, reuniões e anotações.'],produtos:['Produtos e serviços','Seu catálogo para montar propostas.'],equipe:['Responsáveis','Cadastre as pessoas que acompanham clientes e vendas.'],relatorios:['Relatórios','Visão dos valores registrados no CRM.'],historico:['Histórico','Alterações e movimentações dos registros.']};
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((v||0)/100),date=v=>v?new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR'):'—',today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let data={},page=location.hash.slice(1)||'dashboard',query='',owner='',status='',archived=false,editing=null,contacts=[],toastTimer;
if(!pages[page])page='dashboard';
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4000);}
async function api(body,path='/api/crm'){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Painel':'1'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.erro||'Não foi possível concluir');return d;}
async function refresh(){data=await api();render();}
const active=t=>(data[t]||[]).filter(x=>!x.arquivado),client=id=>(data.clientes||[]).find(c=>c.id===id),clientName=id=>client(id)?.nome||'Sem cliente';
const label=t=>pages[t]?.[0]||t;
function rows(t){return (data[t]||[]).filter(x=>(archived?!!x.arquivado:!x.arquivado)&&(!owner||x.responsavel===owner)&&(!status||(t==='tarefas'?(status==='Vencidas'?!x.concluida&&x.prazo&&x.prazo<today():status==='Concluídas'?!!x.concluida:!x.concluida):(x.etapa||x.status)===status))&&(!query||(Object.values(x).filter(v=>typeof v==='string').join(' ')+' '+clientName(x.cliente_id)).toLocaleLowerCase().includes(query.toLocaleLowerCase())));}
const btn=(text,action,id='',type='')=>`<button type="button" class="btn small ${type}" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
const wa=c=>c?.jid?`<a class="btn small" href="/?crm_chat=${encodeURIComponent(c.jid)}">WhatsApp ↗</a>`:'';
function metrics(){const ops=active('oportunidades'),open=ops.filter(o=>!['Ganho','Perdido'].includes(o.etapa)),won=ops.filter(o=>o.etapa==='Ganho'),lost=ops.filter(o=>o.etapa==='Perdido'),due=active('tarefas').filter(t=>!t.concluida&&t.prazo&&t.prazo<=today());return {ops,open,won,lost,due};}
function render(){const [title,sub]=pages[page];$('#page-title').textContent=title;$('#subtitle').textContent=sub;$('#nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${k===page?'active':''}" data-page="${k}">${v[0]}</button>`).join('');const isEntity=!!data[page]&&page!=='historico';$('#actions').innerHTML=btn('Atualizar','refresh')+(isEntity?btn('Exportar CSV','export')+btn('+ Novo','new','','primary'):'')+(page==='clientes'?btn('Do WhatsApp','contacts')+btn('Importar CSV','import'):'');
$('#filters').innerHTML=isEntity?`<input type="search" id="search" placeholder="Pesquisar ${title.toLowerCase()}" value="${esc(query)}" aria-label="Pesquisar"><select id="owner" aria-label="Responsável"><option value="">Todos os responsáveis</option>${[...new Set([...(data[page]||[]).map(x=>x.responsavel),...active('equipe').map(x=>x.nome)])].filter(Boolean).map(x=>`<option ${owner===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${['oportunidades','tarefas','propostas'].includes(page)?`<select id="status" aria-label="Situação"><option value="">Todas as situações</option>${(page==='oportunidades'?data.etapas:page==='tarefas'?['Pendentes','Vencidas','Concluídas']:['Rascunho','Enviada','Aceita','Recusada']).map(x=>`<option ${status===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}<label class="check"><input type="checkbox" id="archived" ${archived?'checked':''}>Arquivados</label>`:'';
if($('#search')){$('#search').oninput=e=>{query=e.target.value;renderContent();};$('#owner').onchange=e=>{owner=e.target.value;renderContent();};$('#archived').onchange=e=>{archived=e.target.checked;renderContent();};if($('#status'))$('#status').onchange=e=>{status=e.target.value;renderContent();};}renderContent();}
function renderContent(){let html='';const m=metrics();
if(['dashboard','relatorios'].includes(page)){const sum=a=>a.reduce((n,o)=>n+o.valor_centavos,0),rate=m.won.length+m.lost.length?Math.round(100*m.won.length/(m.won.length+m.lost.length)):0;html=`<div class="metrics">${[['Em negociação',money(sum(m.open))],['Vendas ganhas',money(sum(m.won))],['Conversão de encerradas',rate+'%'],['Tarefas até hoje',m.due.length]].map(([a,b])=>`<div class="metric"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div><div class="grid"><section class="panel"><h3>Distribuição do funil</h3>${data.etapas.map(e=>{const a=m.ops.filter(o=>o.etapa===e);return `<div>${esc(e)} · ${a.length} · ${money(sum(a))}<div class="bar"><i style="width:${m.ops.length?a.length/m.ops.length*100:0}%"></i></div></div>`;}).join('')}</section><section class="panel"><h3>Próximos retornos</h3>${m.due.length?m.due.slice(0,10).sort((a,b)=>a.prazo.localeCompare(b.prazo)).map(t=>`<p><b>${esc(t.titulo)}</b><br><small>${esc(clientName(t.cliente_id))} · ${date(t.prazo)}</small> ${btn('Concluir','complete',t.id)}</p>`).join(''):'<p class="note">Nenhuma tarefa pendente até hoje.</p>'}</section></div>`;
if(page==='relatorios'){const names=[...new Set(m.ops.map(o=>o.responsavel||'Sem responsável'))];html+=`<h3>Resultados por responsável</h3><div class="table-wrap"><table><tr><th>Responsável</th><th>Oportunidades</th><th>Ganhas</th><th>Valor ganho</th></tr>${names.map(n=>{const a=m.ops.filter(o=>(o.responsavel||'Sem responsável')===n),w=a.filter(o=>o.etapa==='Ganho');return `<tr><td>${esc(n)}</td><td>${a.length}</td><td>${w.length}</td><td>${money(sum(w))}</td></tr>`;}).join('')}</table></div><p class="note">Totais dos registros ativos, de todo o período. Vendas ganhas não representam confirmação de recebimento financeiro.</p>`;}}
else if(page==='oportunidades'&&!archived){const list=rows(page);html=`<div class="board">${data.etapas.map(e=>{const a=list.filter(o=>o.etapa===e);return `<section class="column" data-stage="${esc(e)}"><h3>${esc(e)} <span class="tag">${a.length}</span></h3><small>${money(a.reduce((n,o)=>n+o.valor_centavos,0))}</small>${a.map(o=>`<article class="card" draggable="true" data-drag="${esc(o.id)}"><b>${esc(o.titulo)}</b><p>${esc(clientName(o.cliente_id))}</p><p class="money">${money(o.valor_centavos)}</p><p>${esc(o.responsavel||'Sem responsável')} · ${date(o.previsao)}</p>${btn('Editar / mover','edit',o.id)}${wa(client(o.cliente_id))}</article>`).join('')}</section>`;}).join('')}</div><p class="note">Arraste os cartões entre as etapas ou use Editar / mover.</p>`;}
else if(page==='historico'){html=table(['Data','Registro','Evento'],data.historico.map(x=>[date(x.em),esc(label(x.entidade)),esc(x.evento)]));}
else{const list=rows(page);html=list.length?table([page==='clientes'?'Cliente':'Registro','Informações','Ações'],list.map(o=>{let info='';if(page==='clientes')info=`${esc(o.empresa)}<small>${esc(o.telefone)} · ${esc(o.email)}</small><small>${esc(o.origem)} · ${esc(o.responsavel)}</small>`;else if(page==='propostas')info=`${esc(clientName(o.cliente_id))}<small>${money(o.total_centavos)} · ${esc(o.status)} · Validade ${date(o.validade)}</small>`;else if(page==='tarefas')info=`${esc(clientName(o.cliente_id))}<small>${date(o.prazo)} · ${esc(o.responsavel)}</small><span class="tag ${!o.concluida&&o.prazo&&o.prazo<today()?'red':''}">${o.concluida?'Concluída':o.prazo&&o.prazo<today()?'Vencida':'Pendente'} · ${esc(o.prioridade)}</span>`;else if(page==='produtos')info=money(o.valor_centavos)+`<small>${esc(o.descricao)}</small>`;else if(page==='atividades')info=esc(clientName(o.cliente_id))+`<small>${esc(o.tipo)} · ${esc(o.notas)}</small>`;else if(page==='equipe')info=esc(o.email)+`<small>${esc(o.funcao)}</small>`;else info=esc(o.etapa)+' · '+money(o.valor_centavos);let actions=o.arquivado?btn('Restaurar','restore',o.id):btn('Editar','edit',o.id)+btn('Arquivar','archive',o.id);if(!o.arquivado&&page==='clientes')actions=btn('Ficha','profile',o.id)+wa(o)+actions;if(!o.arquivado&&page==='tarefas')actions=btn(o.concluida?'Reabrir':'Concluir','complete',o.id)+actions;if(!o.arquivado&&page==='propostas')actions=btn('Ver / PDF','proposal',o.id)+btn('Criar oportunidade','convert',o.id)+actions;return [esc(o.nome||o.titulo),info,actions];})):empty();if(page==='equipe')html+='<p class="note">Responsáveis organizam a atribuição do trabalho. O acesso desta instalação continua compartilhado; este cadastro não cria logins nem permissões individuais.</p>';}
$('#content').innerHTML=html;document.querySelectorAll('[data-drag]').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.drag));document.querySelectorAll('[data-stage]').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('over');};el.ondragleave=()=>el.classList.remove('over');el.ondrop=async e=>{e.preventDefault();el.classList.remove('over');const o=data.oportunidades.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(o)await saveAction({entidade:'oportunidades',id:o.id,versao:o.atualizado,etapa:el.dataset.stage});};});}
function empty(){return '<div class="empty"><h3>Nenhum registro por aqui</h3><p>Crie um registro ou ajuste os filtros para começar.</p></div>';}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
const fields={clientes:['nome','telefone','email','empresa','jid','origem','responsavel','notas'],oportunidades:['titulo','cliente_id','etapa','valor_centavos','previsao','responsavel','motivo_perda','notas'],tarefas:['titulo','cliente_id','prazo','prioridade','responsavel','concluida','notas'],produtos:['nome','descricao','valor_centavos'],propostas:['titulo','cliente_id','status','validade','desconto_centavos','notas'],atividades:['titulo','cliente_id','tipo','notas'],equipe:['nome','email','funcao']};
const names={nome:'Nome',titulo:'Título',telefone:'Telefone com DDI',email:'E-mail',empresa:'Empresa',jid:'Conversa vinculada',origem:'Origem do contato',responsavel:'Responsável',notas:'Anotações',cliente_id:'Cliente',etapa:'Etapa do funil',valor_centavos:'Valor (R$)',previsao:'Previsão de fechamento',motivo_perda:'Motivo da perda',prazo:'Prazo',prioridade:'Prioridade',concluida:'Situação',descricao:'Descrição',status:'Situação',validade:'Válida até',desconto_centavos:'Desconto (R$)',tipo:'Tipo de atividade',funcao:'Função'};
function options(k){return k==='cliente_id'?[['','Sem cliente'],...active('clientes').map(x=>[x.id,x.nome])]:k==='etapa'?data.etapas.map(x=>[x,x]):k==='status'?['Rascunho','Enviada','Aceita','Recusada'].map(x=>[x,x]):k==='prioridade'?['Baixa','Normal','Alta'].map(x=>[x,x]):k==='concluida'?[[0,'Pendente'],[1,'Concluída']]:k==='tipo'?['Nota','Ligação','Reunião','Retorno'].map(x=>[x,x]):null;}
function openEditor(t,o={}){editing={t,o};$('#modal-title').textContent=(o.id?'Editar · ':'Novo · ')+label(t);$('#modal-body').innerHTML=`<form id="edit-form"><div class="fields">${fields[t].map(k=>{const opts=options(k),v=o[k]??(k==='prioridade'?'Normal':'');let input=opts?`<select name="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:['notas','descricao'].includes(k)?`<textarea name="${k}" maxlength="10000">${esc(v)}</textarea>`:`<input name="${k}" ${['titulo','nome'].includes(k)?'required maxlength="200"':''} ${k==='responsavel'?'list="owners"':''} type="${['prazo','previsao','validade'].includes(k)?'date':k.endsWith('_centavos')?'number':k==='email'?'email':'text'}" ${k.endsWith('_centavos')?'min="0" step="0.01"':''} value="${esc(k.endsWith('_centavos')?(Number(v)||0)/100:v)}">`;return `<label class="${['notas','descricao','jid'].includes(k)?'wide':''}">${names[k]}${input}</label>`;}).join('')}</div><datalist id="owners">${active('equipe').map(x=>`<option value="${esc(x.nome)}">`).join('')}</datalist>${t==='propostas'?`<h3>Itens da proposta</h3><p class="note">Descrição · Quantidade · Valor unitário</p><div id="items"></div><div class="actions">${btn('+ Item','add-item')}<select id="catalog"><option value="">Adicionar do catálogo…</option>${active('produtos').map(x=>`<option value="${esc(x.id)}">${esc(x.nome)} · ${money(x.valor_centavos)}</option>`).join('')}</select></div><p id="proposal-total"></p>`:''}<p class="error" id="form-error" role="alert"></p><div class="footer"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Salvar</button></div></form>`;
if(t==='propostas'){(o.itens?.length?o.itens:[{nome:'',quantidade:1,valor_centavos:0}]).forEach(addItem);$('#catalog').onchange=e=>{const p=active('produtos').find(x=>x.id===e.target.value);if(p)addItem({nome:p.nome,quantidade:1,valor_centavos:p.valor_centavos});e.target.value='';};$('#edit-form').oninput=proposalTotal;proposalTotal();}
$('#cancel').onclick=()=>$('#modal').close();$('#edit-form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.entidade=t;if(o.id){d.id=o.id;d.versao=o.atualizado;}for(const k of ['valor_centavos','desconto_centavos'])if(k in d)d[k]=Math.round(Number(d[k])*100);if('concluida'in d)d.concluida=Number(d.concluida);if(t==='propostas')d.itens=readItems();$('#save').disabled=true;try{await api(d);$('#modal').close();await refresh();toast('Registro salvo');}catch(e){$('#form-error').textContent=e.message;}finally{if($('#save'))$('#save').disabled=false;}};if(!$('#modal').open)$('#modal').showModal();}
function addItem(i={nome:'',quantidade:1,valor_centavos:0}){$('#items').insertAdjacentHTML('beforeend',`<div class="item"><input data-item="nome" placeholder="Descrição" required maxlength="200" aria-label="Descrição do item" value="${esc(i.nome)}"><input data-item="quantidade" type="number" min="1" max="10000" required aria-label="Quantidade" value="${i.quantidade}"><input data-item="valor" type="number" min="0" step="0.01" required aria-label="Valor unitário" value="${i.valor_centavos/100}"><button type="button" class="btn small danger" data-action="remove-item" aria-label="Remover item">×</button></div>`);proposalTotal();}
function readItems(){return [...document.querySelectorAll('#items .item')].map(el=>({nome:el.querySelector('[data-item=nome]').value,quantidade:Number(el.querySelector('[data-item=quantidade]').value),valor_centavos:Math.round(Number(el.querySelector('[data-item=valor]').value)*100)}));}
function proposalTotal(){if(!$('#proposal-total'))return;const discount=Number($('#edit-form [name=desconto_centavos]').value||0)*100;$('#proposal-total').textContent='Total: '+money(readItems().reduce((s,i)=>s+i.quantidade*i.valor_centavos,0)-discount);}
async function saveAction(d){try{await api(d);await refresh();toast('Alteração salva');}catch(e){$('#notice').className='error';$('#notice').textContent=e.message;}}
function profile(id){const c=client(id);$('#modal-title').textContent=c.nome;$('#modal-body').innerHTML=`<div class="dialog-body"><p>${esc(c.empresa)}<br>${esc(c.telefone)} · ${esc(c.email)}</p><div class="actions">${wa(c)}${btn('+ Oportunidade','client-op',id)}${btn('+ Tarefa','client-task',id)}${btn('+ Atividade','client-activity',id)}${btn('+ Proposta','client-proposal',id)}</div><p style="white-space:pre-wrap">${esc(c.notas)}</p><h3>Negociações</h3>${active('oportunidades').filter(o=>o.cliente_id===id).map(o=>`<p>${esc(o.titulo)} · ${esc(o.etapa)} · ${money(o.valor_centavos)}</p>`).join('')||'<p class="note">Sem oportunidades.</p>'}<h3>Acompanhamento</h3><div class="timeline">${[...active('atividades').filter(o=>o.cliente_id===id).map(o=>({titulo:o.titulo,notas:o.notas,em:o.atualizado,tipo:o.tipo})),...active('tarefas').filter(o=>o.cliente_id===id).map(o=>({titulo:o.titulo,notas:o.notas,em:o.atualizado,tipo:(o.concluida?'Concluída':'Pendente')+' · '+date(o.prazo)}))].sort((a,b)=>b.em.localeCompare(a.em)).map(o=>`<article><b>${esc(o.titulo)}</b><small> · ${esc(o.tipo)} · ${date(o.em)}</small><p>${esc(o.notas)}</p></article>`).join('')||'<p class="note">Registre seu primeiro contato ou próximo retorno.</p>'}</div></div>`;$('#modal').showModal();}
function proposal(id){const p=data.propostas.find(x=>x.id===id),c=client(p.cliente_id);const html=`<h1>${esc(p.titulo)}</h1><p>Proposta ${esc(p.id.slice(0,8).toUpperCase())} · ${date(p.criado||p.atualizado)}</p><p><b>${esc(c?.nome||'Cliente não informado')}</b><br>${esc(c?.empresa||'')}<br>${esc(c?.email||'')}</p><p>Validade: ${date(p.validade)} · Situação: ${esc(p.status)}</p>${table(['Item','Quantidade','Unitário','Subtotal'],p.itens.map(i=>[esc(i.nome),i.quantidade,money(i.valor_centavos),money(i.quantidade*i.valor_centavos)]))}<p>Desconto: ${money(p.desconto_centavos)}</p><h2>Total: ${money(p.total_centavos)}</h2><p style="white-space:pre-wrap">${esc(p.notas)}</p>`;$('#modal-title').textContent='Proposta comercial';$('#modal-body').innerHTML=`<div class="dialog-body">${html}<div class="footer">${btn('Imprimir / salvar PDF','print')}${wa(c)}</div></div>`;$('#print').innerHTML=html;$('#modal').showModal();}
async function showContacts(){const r=await api(null,'/api/crm/contatos');contacts=r.contatos;$('#modal-title').textContent='Adicionar cliente do WhatsApp';$('#modal-body').innerHTML='<div class="dialog-body"><input id="contact-search" type="search" placeholder="Pesquisar nome ou telefone" style="width:100%"><p class="note">Selecione um contato para revisar e salvar a ficha.</p><div id="contact-list"></div></div>';const draw=()=>{const q=$('#contact-search').value.toLowerCase();$('#contact-list').innerHTML=contacts.filter(c=>(c.nome+' '+c.telefone).toLowerCase().includes(q)).slice(0,50).map(c=>`<p>${esc(c.nome)} · ${esc(c.telefone)} ${btn('Selecionar','contact',c.jid)}</p>`).join('')||'<p>Nenhum contato encontrado.</p>';};$('#contact-search').oninput=draw;draw();$('#modal').showModal();}
function exportCSV(){const list=rows(page);if(!list.length)return toast('Nenhum registro para exportar');const keys=Object.keys(list[0]).filter(k=>k!=='itens');const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const text=[keys,...list.map(x=>keys.map(k=>x[k]))].map(r=>r.map(cell).join(';')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='mark-crm-'+page+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function parseCSV(s){s=s.replace(/^\ufeff/,'');const sep=s.split(/\r?\n/)[0].includes(';')?';':',';let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++;}else quoted=!quoted;}else if(c===sep&&!quoted){row.push(v);v='';}else if(c==='\n'&&!quoted){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v='';}else v+=c;}if(quoted)throw Error('CSV com aspas incompletas');if(v||row.length){row.push(v.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(Boolean));}
$('#import-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('Limite de importação: 1 MB');const all=parseCSV(await file.text()),head=all.shift()?.map(x=>x.trim().toLowerCase());if(!head?.includes('nome'))throw Error('O CSV precisa da coluna nome. Opcionais: telefone, email, empresa, origem, responsavel, notas.');if(all.length>200)throw Error('Importe até 200 clientes por vez');const records=all.map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]||'']))).filter(r=>r.nome);if(!confirm(`Importar ${records.length} clientes? Números e e-mails já cadastrados serão ignorados.`))return;let saved=0,skipped=0;const known=[...active('clientes')];for(const r of records){if(known.some(c=>(r.telefone&&c.telefone.replace(/\D/g,'')===r.telefone.replace(/\D/g,''))||(r.email&&c.email.toLowerCase()===r.email.toLowerCase()))){skipped++;continue;}const d={entidade:'clientes'};for(const k of ['nome','telefone','email','empresa','origem','responsavel','notas'])d[k]=r[k]||'';try{await api(d);known.push(d);saved++;}catch(err){await refresh();throw Error(`Importação parcial: ${saved} salvos, ${skipped} ignorados. Falha em ${r.nome}: ${err.message}`);}}await refresh();toast(`${saved} clientes importados; ${skipped} ignorados.`);}catch(err){$('#notice').className='error';$('#notice').textContent=err.message;}finally{e.target.value='';}};
document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;location.hash=page;query=owner=status='';archived=false;render();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,o=(data[page]||[]).find(x=>x.id===id);try{if(a==='new')openEditor(page);else if(a==='edit')openEditor(page,o);else if(a==='refresh')await refresh();else if(a==='export')exportCSV();else if(a==='import')$('#import-file').click();else if(a==='contacts')await showContacts();else if(a==='contact'){const c=contacts.find(x=>x.jid===id),existing=active('clientes').find(x=>x.jid===id);openEditor('clientes',existing||{nome:c.nome,telefone:c.telefone,jid:c.jid});}else if(a==='archive'&&confirm('Arquivar este registro? Você poderá restaurá-lo usando o filtro Arquivados.'))await saveAction({entidade:page,id,acao:'arquivar',versao:o.atualizado});else if(a==='restore')await saveAction({entidade:page,id,acao:'restaurar',versao:o.atualizado});else if(a==='complete'){const t=data.tarefas.find(x=>x.id===id);await saveAction({entidade:'tarefas',id,versao:t.atualizado,concluida:t.concluida?0:1});}else if(a==='profile')profile(id);else if(a.startsWith('client-')){const t={'client-op':'oportunidades','client-task':'tarefas','client-activity':'atividades','client-proposal':'propostas'}[a];openEditor(t,{cliente_id:id});}else if(a==='proposal')proposal(id);else if(a==='print')window.print();else if(a==='convert'){const p=data.propostas.find(x=>x.id===id);openEditor('oportunidades',{titulo:p.titulo,cliente_id:p.cliente_id,valor_centavos:p.total_centavos,etapa:p.status==='Aceita'?'Ganho':'Proposta',notas:'Proposta: '+p.id});}else if(a==='add-item')addItem();else if(a==='remove-item'){b.closest('.item').remove();proposalTotal();}}catch(err){$('#notice').className='error';$('#notice').textContent=err.message;}});
$('#close').onclick=()=>$('#modal').close();refresh().then(()=>{const params=new URLSearchParams(location.search),jid=params.get('jid');if(jid){const c=active('clientes').find(x=>x.jid===jid);if(c)profile(c.id);else openEditor('clientes',{nome:params.get('nome')||'',jid,telefone:jid.endsWith('@s.whatsapp.net')?jid.split('@')[0]:''});}}).catch(e=>{$('#notice').className='error';$('#notice').textContent=e.message;});
</script></body></html>
