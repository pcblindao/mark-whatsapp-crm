<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM · Mark WhatsApp CRM</title>
<style>body{margin:0;background:#f2f5f7;color:#17252a;font:15px system-ui}header,main{padding:24px;max-width:1400px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}a{color:#007d69}button{border:0;border-radius:8px;background:#007d69;color:white;padding:11px;cursor:pointer}nav{display:flex;gap:10px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow:auto;margin-top:24px}.column{background:#e3e9ec;padding:12px;border-radius:10px;min-height:220px}.card{background:white;padding:16px;border-radius:9px;margin:10px 0;box-shadow:0 2px 5px #0001}.card button{margin:5px 5px 0 0;font-size:12px}table{width:100%;border-collapse:collapse;background:white;margin-top:24px}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd}dialog{border:0;border-radius:14px;width:min(440px,85vw)}dialog::backdrop{background:#0008}label{display:block;margin:12px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b7c3c8;border-radius:6px}#erro{color:#a82121}small{color:#54676f}h1{font-size:24px}.total{margin:20px 0;font-size:18px}</style>
<header><div><h1>Mark WhatsApp CRM</h1><small>Clientes, oportunidades e próximos passos</small></div><a href="/">Abrir WhatsApp</a></header><main><nav><button data-tab="oportunidades">Funil de vendas</button><button data-tab="clientes">Clientes</button><button data-tab="tarefas">Tarefas</button><button data-tab="historico">Histórico</button><button id="novo">+ Novo registro</button></nav><p id="erro" role="alert"></p><div id="conteudo"></div></main>
<dialog id="editor"><form id="form"><h2 id="titulo">Registro</h2><div id="campos"></div><p id="form-erro" role="alert"></p><button type="submit">Salvar</button> <button type="button" id="cancelar">Cancelar</button></form></dialog>
<script>
let dados={},tab='oportunidades',edit=null; const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moeda=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n/100);
async function api(body){const r=await fetch('/api/crm',body?{method:'POST',headers:{'Content-Type':'application/json','X-Painel':'1'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.erro||'Falha na operação');return d;}
async function carregar(){try{dados=await api();render();}catch(e){$('#erro').textContent=e.message;}}
const cliente=id=>(dados.clientes||[]).find(c=>c.id===id)?.nome||'Sem cliente';
function render(){ $('#novo').hidden=tab==='historico';$('#erro').textContent='';const box=$('#conteudo');
if(tab==='oportunidades'){box.innerHTML='<p class="total">Em negociação: '+moeda(dados.oportunidades.filter(o=>!['Ganho','Perdido'].includes(o.etapa)).reduce((a,b)=>a+b.valor_centavos,0))+'</p><div class="board">'+dados.etapas.map(e=>'<section class="column"><b>'+esc(e)+'</b>'+dados.oportunidades.filter(o=>o.etapa===e).map(o=>'<article class="card"><b>'+esc(o.titulo)+'</b><p>'+esc(cliente(o.cliente_id))+'</p><p>'+moeda(o.valor_centavos)+'</p><button data-edit="'+esc(o.id)+'">Editar / mover</button></article>').join('')+'</section>').join('')+'</div>';}
else if(tab==='historico'){box.innerHTML='<table><tr><th>Data</th><th>Tipo</th><th>Evento</th></tr>'+dados.historico.map(h=>'<tr><td>'+esc(new Date(h.em).toLocaleString('pt-BR'))+'</td><td>'+esc(h.entidade)+'</td><td>'+esc(h.evento)+'</td></tr>').join('')+'</table>';}
else {box.innerHTML='<table><tr><th>'+ (tab==='clientes'?'Cliente':'Tarefa')+'</th><th>Detalhes</th><th>Ação</th></tr>'+dados[tab].map(o=>'<tr><td>'+esc(o.nome||o.titulo)+'</td><td>'+esc(tab==='clientes'?(o.empresa+' · '+o.telefone):(cliente(o.cliente_id)+' · '+(o.prazo||'Sem prazo')+' · '+(o.concluida?'Concluída':'Pendente')))+'</td><td><button data-edit="'+esc(o.id)+'">Editar</button></td></tr>').join('')+'</table>';}
box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>abrir(dados[tab].find(o=>o.id===b.dataset.edit)));}
function abrir(o={}){edit=o.id||null;$('#form-erro').textContent='';const campos=tab==='clientes'?['nome','telefone','email','empresa','jid','notas']:tab==='oportunidades'?['titulo','cliente_id','etapa','valor_centavos','responsavel','notas']:['titulo','cliente_id','prazo','concluida','notas'];const labels={nome:'Nome',telefone:'Telefone com DDI',email:'E-mail',empresa:'Empresa',jid:'Identificador da conversa (opcional)',notas:'Anotações',titulo:'Título',cliente_id:'Cliente',etapa:'Etapa',valor_centavos:'Valor em R$',responsavel:'Responsável',prazo:'Prazo',concluida:'Situação'};
$('#campos').innerHTML=campos.map(k=>{let f;if(k==='cliente_id')f='<select name="'+k+'"><option value="">Sem cliente</option>'+dados.clientes.map(c=>'<option value="'+esc(c.id)+'" '+(o[k]===c.id?'selected':'')+'>'+esc(c.nome)+'</option>').join('')+'</select>';else if(k==='etapa'||k==='concluida'){const opts=k==='etapa'?dados.etapas:['Pendente','Concluída'];f='<select name="'+k+'">'+opts.map((v,i)=>'<option value="'+esc(k==='etapa'?v:i)+'" '+(o[k]===(k==='etapa'?v:i)?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>';}else if(k==='notas')f='<textarea name="notas">'+esc(o[k])+'</textarea>';else f='<input name="'+k+'" type="'+(k==='prazo'?'date':k==='valor_centavos'?'number':k==='email'?'email':'text')+'" '+(['nome','titulo'].includes(k)?'required maxlength="200"':'')+' '+(k==='valor_centavos'?'min="0" step="0.01"':'')+' value="'+esc(k==='valor_centavos'?(o[k]||0)/100:o[k])+'">';return '<label>'+labels[k]+f+'</label>';}).join('');$('#editor').showModal();}
$('nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render();}};$('#novo').onclick=()=>abrir();$('#cancelar').onclick=()=>$('#editor').close();$('#form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.entidade=tab;if(edit)d.id=edit;if(tab==='oportunidades')d.valor_centavos=Math.round(Number(d.valor_centavos)*100);if(tab==='tarefas')d.concluida=Number(d.concluida);try{await api(d);$('#editor').close();await carregar();}catch(e){$('#form-erro').textContent=e.message;}};carregar();
</script></html>
